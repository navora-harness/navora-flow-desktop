name: test
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: navora-flow-desktop
      - uses: actions/checkout@v4
        with:
          repository: navora-harness/navora-flow-library-sdk
          path: navora-flow-library-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build SDK
        working-directory: navora-flow-library-sdk
        run: npm ci && npm run build
      - name: Test desktop
        working-directory: navora-flow-desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci && npm test && npm run typecheck
